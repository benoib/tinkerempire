<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TinkerEmpire</title>
<meta name="description" content="We create cool stuff. Reach out if you want to participate.">
<meta property="og:title" content="TinkerEmpire">
<meta property="og:description" content="We create cool stuff. Reach out if you want to participate.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Crect x='8' y='8' width='7' height='7' rx='1.5' fill='%23fff'/%3E%3Crect x='17' y='8' width='7' height='7' rx='1.5' fill='%23fff' fill-opacity='.3'/%3E%3Crect x='8' y='17' width='7' height='7' rx='1.5' fill='%23fff' fill-opacity='.3'/%3E%3Crect x='17' y='17' width='7' height='7' rx='1.5' fill='%23fff' fill-opacity='.3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --ink: #F5F5F4;
    --mute: #8A8A87;
    --line: rgba(255, 255, 255, .1);
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.6 'Geist', 'Helvetica Neue', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
    min-height: 100svh;
    padding: 0 clamp(20px, 5vw, 64px);
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(700px 500px at 85% 10%, rgba(255, 255, 255, .05), transparent 70%);
  }
  a { color: inherit; text-decoration: none; }
  a:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 4px; border-radius: 6px; }

  header, footer { display: flex; align-items: center; justify-content: space-between; height: 88px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 17px; letter-spacing: -.02em; }
  .logo svg { width: 24px; height: 24px; }

  main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 48px 0 72px; }
  h1 {
    font: 400 clamp(56px, 11vw, 148px)/.98 'Instrument Serif', Georgia, serif;
    letter-spacing: -.035em;
  }
  p { color: var(--mute); font-size: clamp(17px, 1.6vw, 20px); margin: 28px 0 44px; }
  .cta {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 12px;
    height: 52px; padding: 0 22px; border-radius: 6px;
    background: var(--ink); color: #000;
    font: 500 15px/1 'Geist', 'Helvetica Neue', sans-serif;
    transition: background .2s, transform .1s;
  }
  .cta:hover { background: #fff; }
  .cta:active { transform: scale(.98); }
  .cta span { transition: transform .2s var(--ease); }
  .cta:hover span { transform: translate(2px, -2px); }

  footer { border-top: 1px solid var(--line); font-size: 13px; color: var(--mute); }
  footer a:hover { color: var(--ink); }

  .reveal { opacity: 0; transform: translateY(12px); animation: in .8s var(--ease) forwards; animation-delay: calc(var(--i, 0) * 90ms); }
  @keyframes in { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .reveal { animation: none; opacity: 1; transform: none; } }
</style>
</head>
<body>
  <header>
    <a class="logo" href="/" aria-label="TinkerEmpire">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="2.5" fill="#F5F5F4"/><rect x="18" y="2" width="12" height="12" rx="2.5" fill="#F5F5F4" fill-opacity=".3"/><rect x="2" y="18" width="12" height="12" rx="2.5" fill="#F5F5F4" fill-opacity=".3"/><rect x="18" y="18" width="12" height="12" rx="2.5" fill="#F5F5F4" fill-opacity=".3"/></svg>
      TinkerEmpire
    </a>
  </header>

  <main>
    <h1 class="reveal">We create<br>cool stuff.</h1>
    <p class="reveal" style="--i:1">Reach out if you want to participate.</p>
    <a class="cta reveal" style="--i:2" href="#" data-contact>Contact <span aria-hidden="true">&#8599;</span></a>
  </main>

  <footer>
    <span>&copy; 2026 TinkerEmpire</span>
    <a href="#" data-contact>Contact</a>
  </footer>

  <script>
    // Address is assembled on click only: never in the markup, the hover status bar or for scrapers.
    document.querySelectorAll('[data-contact]').forEach((a) => a.addEventListener('click', (e) => {
      e.preventDefault();
      location.href = 'mailto:' + ['b', ['tinkerempire', 'com'].join('.')].join('@');
    }));
  </script>
</body>
</html>
